<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151c;
      --surface: rgba(30, 36, 47, 0.92);
      --surface-strong: #222936;
      --border: rgba(255, 255, 255, 0.12);
      --text: #edf1f7;
      --muted: #aeb8c7;
      --accent: #80a6ff;
      --accent-soft: rgba(128, 166, 255, 0.14);
      --on-accent: #11151c;
      --danger: #ff9292;
      --danger-soft: rgba(255, 133, 133, 0.1);
      --danger-hover: rgba(255, 133, 133, 0.18);
      --success: #68c996;
      --badge-gemini-start: #326fd1;
      --badge-gemini-end: #7950aa;
      --badge-symbol: #fff;
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
      --transparent: transparent;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f3f5f8;
        --surface: rgba(255, 255, 255, 0.92);
        --surface-strong: #fff;
        --border: rgba(27, 35, 48, 0.16);
        --text: #18202c;
        --muted: #5c6676;
        --accent: #275cc7;
        --accent-soft: rgba(39, 92, 199, 0.12);
        --on-accent: #fff;
        --danger: #a92e2e;
        --danger-soft: rgba(169, 46, 46, 0.1);
        --danger-hover: rgba(169, 46, 46, 0.16);
        --success: #24754c;
        --badge-gemini-start: #326fd1;
        --badge-gemini-end: #7950aa;
        --badge-symbol: #fff;
        --shadow: 0 10px 30px rgba(28, 37, 52, 0.08);
        --transparent: transparent;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
      padding: 16px;
      overflow: hidden;
    }

    .setup,
    .pane {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .setup {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(300px, 0.9fr);
      gap: 14px;
      padding: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .label,
    .pane-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    #topic {
      width: 100%;
      min-height: 118px;
      max-height: 220px;
      resize: vertical;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: var(--surface-strong);
      line-height: 1.45;
    }

    #topic:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-width: 0;
    }

    .participants {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .participant-chip {
      display: inline-grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      gap: 2px 7px;
      align-items: center;
      max-width: min(250px, 100%);
      min-width: 0;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: var(--surface-strong);
    }

    .participant-chip.unavailable {
      filter: grayscale(1);
      opacity: 0.58;
    }

    .participant-chip.failed {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .participant-chip input {
      grid-row: 1 / span 2;
      margin: 0;
      accent-color: var(--accent);
    }

    .participant-badge {
      display: block;
      grid-row: 1 / span 2;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--muted);
      object-fit: cover;
      box-shadow: 0 0 0 1px var(--border);
    }

    .participant-badge.gemini {
      display: grid;
      place-items: center;
      background: linear-gradient(
        135deg,
        var(--badge-gemini-start),
        var(--badge-gemini-end)
      );
    }

    .participant-badge svg {
      display: block;
      width: 14px;
      height: 14px;
    }

    .participant-badge-symbol {
      fill: none;
      stroke: var(--badge-symbol);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .participant-badge-symbol.filled {
      fill: var(--badge-symbol);
      stroke: none;
    }

    .participant-name {
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .participant-status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .moderator-row {
      display: grid;
      grid-template-columns: auto minmax(130px, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .working-directory-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }

    .working-directory-path {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .working-directory-warning {
      padding: 8px 10px;
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 11px;
      line-height: 1.4;
    }

    select {
      min-width: 0;
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: var(--surface-strong);
    }

    .detect-button,
    .secondary-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      background: var(--transparent);
    }

    .estimate {
      min-height: 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .primary-button,
    .stop-button {
      min-height: 36px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      color: var(--on-accent);
      font-weight: 700;
    }

    .primary-button {
      background: var(--accent);
    }

    .stop-button {
      background: var(--danger);
    }

    .session-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .error-banner {
      min-height: 0;
      padding: 8px 10px;
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      background: var(--danger-soft);
      font-size: 11px;
      white-space: pre-wrap;
    }

    .error-banner:empty {
      display: none;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
    }

    .scroll {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 12px;
    }

    .round {
      margin-bottom: 14px;
    }

    .round:last-child {
      margin-bottom: 0;
    }

    .round-title {
      margin: 0 0 7px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .turn-card,
    .summary-section {
      margin-bottom: 8px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-strong);
    }

    .turn-card.running.token-stream {
      border-color: var(--accent);
    }

    .turn-card.failed {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .turn-head {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 7px;
    }

    .turn-name {
      font-size: 12px;
      font-weight: 750;
    }

    .turn-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
    }

    .turn-text,
    .turn-error,
    .summary-text {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }

    .turn-text,
    .summary-text {
      font-size: 12.5px;
      line-height: 1.52;
    }

    .turn-error {
      margin-top: 7px;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.42;
    }

    .turn-error-details {
      min-width: 0;
      margin-top: 7px;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.42;
    }

    .turn-error-details summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      padding: 5px 7px;
      border-radius: 6px;
      cursor: pointer;
      list-style: none;
    }

    .turn-error-details summary::-webkit-details-marker {
      display: none;
    }

    .turn-error-details summary::before {
      content: "▸";
      transition: transform 120ms ease;
    }

    .turn-error-details[open] summary::before {
      transform: rotate(90deg);
    }

    .turn-error-details summary:hover {
      background: var(--danger-hover);
    }

    .turn-error-summary-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .turn-error-details .turn-error {
      margin-top: 2px;
      padding: 7px;
      border-top: 1px solid var(--danger);
    }

    .thinking {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .thinking::after {
      content: "";
      width: 22px;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        var(--transparent),
        var(--accent),
        var(--transparent)
      );
      background-size: 200% 100%;
      animation: thinking 1.1s linear infinite;
    }

    @keyframes thinking {
      to { background-position: -200% 0; }
    }

    .placeholder {
      display: grid;
      min-height: 180px;
      place-items: center;
      padding: 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .summary-section h3 {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .setup {
        grid-template-columns: 1fr;
      }

      #topic {
        min-height: 82px;
      }

      .main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="setup">
      <label class="field">
        <span class="label" data-i18n="discussion_topic_label"></span>
        <textarea id="topic" data-i18n-placeholder="discussion_topic_placeholder"></textarea>
      </label>
      <div class="controls">
        <div class="field">
          <span class="label" data-i18n="discussion_participants"></span>
          <div class="participants" id="participants"></div>
        </div>
        <div class="moderator-row">
          <label class="label" for="moderator" data-i18n="discussion_moderator"></label>
          <select id="moderator"></select>
          <button class="detect-button" id="detect" type="button" data-i18n="discussion_detect"></button>
        </div>
        <div class="working-directory-row">
          <span class="label" data-i18n="discussion_working_directory"></span>
          <span class="working-directory-path" id="working-directory-path"></span>
          <button class="secondary-button" id="pick-folder" type="button"
                  data-i18n="discussion_pick_folder"></button>
          <button class="secondary-button" id="clear-folder" type="button"
                  data-i18n="discussion_clear_folder" hidden></button>
        </div>
        <div class="working-directory-warning" id="working-directory-warning"
             data-i18n="discussion_working_directory_warning" hidden></div>
        <div class="estimate" id="estimate"></div>
        <div class="actions">
          <button class="primary-button" id="start" type="button" data-i18n="discussion_start"></button>
          <button class="stop-button" id="stop" type="button" data-i18n="discussion_stop"></button>
          <span class="session-status" id="session-status"></span>
        </div>
        <div class="error-banner" id="error" role="alert"></div>
      </div>
    </section>

    <section class="main">
      <div class="pane">
        <header class="pane-header">
          <span class="pane-title" data-i18n="discussion_history"></span>
        </header>
        <div class="scroll" id="history"></div>
      </div>
      <div class="pane">
        <header class="pane-header">
          <span class="pane-title" data-i18n="discussion_summary"></span>
          <button class="secondary-button" id="copy" type="button" data-i18n="discussion_copy"></button>
        </header>
        <div class="scroll" id="summary"></div>
      </div>
    </section>
  </main>

  <script>
    const I18N = {{I18N_BUNDLE}};
    const INITIAL_LANGUAGE = {{INITIAL_LANGUAGE}};
    const HANDLER = "usageDiscussion";
    const PARTICIPANT_IDS = ["claude", "codex", "gemini"];
    const RUNNING_STATUSES = new Set([
      "PREPARING",
      "ROUND1_RUNNING",
      "ROUND2_RUNNING",
      "SUMMARIZING",
      "CANCELLING",
    ]);
    const SUMMARY_HEADINGS = ["共識", "主要分歧", "建議方案", "風險與未知"];
    const PARTICIPANT_ICON_URIS = {
      claude: "{{CLAUDE_ICON}}",
      codex: "{{CODEX_ICON}}",
    };
    const GEMINI_BADGE = {
      className: "gemini",
      path: "M8 1.5C8.7 5.8 10.2 7.3 14.5 8 10.2 8.7 8.7 10.2 8 14.5 7.3 10.2 5.8 8.7 1.5 8 5.8 7.3 7.3 5.8 8 1.5Z",
      filled: true,
    };
    const DEFAULT_PARTICIPANT_BADGE = {
      className: "default",
      path: "M8 3.5A4.5 4.5 0 1 1 8 12.5 4.5 4.5 0 0 1 8 3.5Z",
      filled: false,
    };

    let currentLanguage = "en";
    let detection = [];
    let selected = new Set();
    let selectionInitialized = false;
    let state = {};
    let currentSessionId = null;
    let latestEventSeq = -1;
    let summaryText = "";
    let copyFeedbackTimer = null;
    let workingDirectory = null;

    const topicEl = document.getElementById("topic");
    const participantsEl = document.getElementById("participants");
    const moderatorEl = document.getElementById("moderator");
    const estimateEl = document.getElementById("estimate");
    const startEl = document.getElementById("start");
    const stopEl = document.getElementById("stop");
    const detectEl = document.getElementById("detect");
    const statusEl = document.getElementById("session-status");
    const errorEl = document.getElementById("error");
    const historyEl = document.getElementById("history");
    const summaryEl = document.getElementById("summary");
    const copyEl = document.getElementById("copy");
    const workingDirectoryPathEl = document.getElementById("working-directory-path");
    const workingDirectoryWarningEl = document.getElementById("working-directory-warning");
    const pickFolderEl = document.getElementById("pick-folder");
    const clearFolderEl = document.getElementById("clear-folder");

    function t(key, params) {
      const lang = I18N[currentLanguage] ? currentLanguage : "en";
      let template = (I18N[lang] && I18N[lang][key]) || (I18N.en && I18N.en[key]) || key;
      if (params) {
        template = template.replace(/\{(\w+)\}/g, (_, name) => `${params[name] ?? ""}`);
      }
      return template;
    }

    function applyStaticText() {
      document.documentElement.lang = currentLanguage === "zh-TW" ? "zh-Hant" : currentLanguage;
      document.title = t("discussion_window_title");
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.dataset.i18n;
        if (key) node.textContent = t(key);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
        const key = node.dataset.i18nPlaceholder;
        if (key) node.placeholder = t(key);
      });
    }

    function send(action, extra) {
      const handler = window.webkit
        && window.webkit.messageHandlers
        && window.webkit.messageHandlers[HANDLER];
      if (!handler) return;
      handler.postMessage(JSON.stringify({ action, ...(extra || {}) }));
    }

    function participantLabel(id) {
      return t(`discussion_participant_${id}`);
    }

    function isRunning() {
      return RUNNING_STATUSES.has(state.status);
    }

    function canStartDiscussion(topic, participantCount, status) {
      return Boolean(`${topic || ""}`.trim())
        && participantCount > 0
        && !RUNNING_STATUSES.has(status);
    }

    function failureForParticipant(id) {
      const turns = Array.isArray(state.turns) ? state.turns : [];
      const failed = [...turns].reverse().find(
        (turn) => turn.participant_id === id && turn.status === "FAILED" && turn.error,
      );
      return failed ? `${failed.error}` : "";
    }

    function createParticipantBadge(id) {
      const iconUri = PARTICIPANT_ICON_URIS[id];
      if (iconUri) {
        const badge = document.createElement("img");
        badge.className = "participant-badge";
        badge.alt = "";
        badge.setAttribute("aria-hidden", "true");
        badge.src = iconUri;
        return badge;
      }
      const config = id === "gemini" ? GEMINI_BADGE : DEFAULT_PARTICIPANT_BADGE;
      const badge = document.createElement("span");
      badge.className = `participant-badge ${config.className}`;
      badge.setAttribute("aria-hidden", "true");
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 16 16");
      const symbol = document.createElementNS("http://www.w3.org/2000/svg", "path");
      symbol.setAttribute("d", config.path);
      symbol.setAttribute(
        "class",
        `participant-badge-symbol${config.filled ? " filled" : ""}`,
      );
      svg.append(symbol);
      badge.append(svg);
      return badge;
    }

    function renderParticipants() {
      participantsEl.replaceChildren();
      const detectionById = new Map(detection.map((item) => [item.adapter_id, item]));
      if (!selectionInitialized && detection.length) {
        selected = new Set(detection.filter((item) => item.available).map((item) => item.adapter_id));
        selectionInitialized = true;
      }

      PARTICIPANT_IDS.forEach((id) => {
        const result = detectionById.get(id);
        const available = Boolean(result && result.available);
        const failure = failureForParticipant(id);
        if (!available) selected.delete(id);

        const chip = document.createElement("label");
        chip.className = "participant-chip";
        if (!available) chip.classList.add("unavailable");
        if (failure) chip.classList.add("failed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = available && selected.has(id);
        checkbox.disabled = !available || isRunning();
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selected.add(id);
          else selected.delete(id);
          renderModerator();
          renderEstimate();
          renderControls();
        });

        const name = document.createElement("span");
        name.className = "participant-name";
        name.textContent = participantLabel(id);
        const status = document.createElement("span");
        status.className = "participant-status";
        if (failure) status.textContent = failure;
        else if (available) status.textContent = t("discussion_available");
        else status.textContent = (result && result.error) || t("discussion_not_detected");
        status.title = status.textContent;

        chip.append(checkbox, createParticipantBadge(id), name, status);
        participantsEl.append(chip);
      });
    }

    function renderModerator() {
      const previous = moderatorEl.value;
      moderatorEl.replaceChildren();
      PARTICIPANT_IDS.filter((id) => selected.has(id)).forEach((id) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = participantLabel(id);
        moderatorEl.append(option);
      });
      if (selected.has(previous)) moderatorEl.value = previous;
      moderatorEl.disabled = isRunning() || selected.size < 2;
    }

    function estimateCalls(count) {
      if (count <= 0) return 0;
      if (count === 1) return 1;
      return count * 2 + 1;
    }

    function renderEstimate() {
      const count = selected.size;
      if (count === 1) {
        estimateEl.textContent = t("discussion_estimate_single", {
          participants: count,
          calls: estimateCalls(count),
        });
        return;
      }
      estimateEl.textContent = t("discussion_estimate", {
        participants: count,
        rounds: 2,
        summary: count > 1 ? 1 : 0,
        calls: estimateCalls(count),
      });
    }

    function renderWorkingDirectory() {
      const selected = typeof workingDirectory === "string" && workingDirectory.length > 0;
      workingDirectoryPathEl.textContent = selected
        ? workingDirectory
        : t("discussion_working_directory_none");
      workingDirectoryPathEl.title = selected ? workingDirectory : "";
      clearFolderEl.hidden = !selected;
      workingDirectoryWarningEl.hidden = !selected;
    }

    function renderControls() {
      const running = isRunning();
      topicEl.disabled = running;
      startEl.disabled = !canStartDiscussion(topicEl.value, selected.size, state.status);
      stopEl.disabled = !running;
      detectEl.disabled = running;
      pickFolderEl.disabled = running;
      clearFolderEl.disabled = running;
      statusEl.textContent = state.status
        ? t(`discussion_status_${state.status.toLowerCase()}`)
        : "";
    }

    function participantNameFromState(id) {
      const participants = Array.isArray(state.participants) ? state.participants : [];
      const participant = participants.find((item) => item.id === id);
      return participant ? `${participant.label}` : participantLabel(id);
    }

    function statusText(turn) {
      if (turn.status === "RUNNING" && !turn.supports_token_stream) {
        return t("discussion_thinking");
      }
      return t(`discussion_turn_${`${turn.status || "PENDING"}`.toLowerCase()}`);
    }

    function renderHistory() {
      historyEl.replaceChildren();
      const turns = (Array.isArray(state.turns) ? state.turns : [])
        .filter((turn) => Number(turn.round_index) < 3);
      if (!turns.length) {
        const empty = document.createElement("div");
        empty.className = "placeholder";
        empty.textContent = t("discussion_history_empty");
        historyEl.append(empty);
        return;
      }

      const rounds = new Map();
      turns.forEach((turn) => {
        const round = Number(turn.round_index);
        if (!rounds.has(round)) rounds.set(round, []);
        rounds.get(round).push(turn);
      });
      [...rounds.keys()].sort((a, b) => a - b).forEach((roundIndex) => {
        const section = document.createElement("section");
        section.className = "round";
        const heading = document.createElement("h2");
        heading.className = "round-title";
        heading.textContent = t("discussion_round", { round: roundIndex });
        section.append(heading);

        rounds.get(roundIndex).forEach((turn) => {
          const card = document.createElement("article");
          card.className = "turn-card";
          if (turn.status === "RUNNING") card.classList.add("running");
          if (turn.status === "FAILED") card.classList.add("failed");
          if (turn.supports_token_stream) card.classList.add("token-stream");

          const head = document.createElement("div");
          head.className = "turn-head";
          const name = document.createElement("span");
          name.className = "turn-name";
          name.textContent = participantNameFromState(turn.participant_id);
          const status = document.createElement("span");
          status.className = "turn-status";
          status.textContent = statusText(turn);
          head.append(name, status);
          card.append(head);

          const text = document.createElement("div");
          text.className = "turn-text";
          text.textContent = `${turn.text || ""}`;
          if (turn.status === "RUNNING" && !turn.supports_token_stream && !turn.text) {
            text.classList.add("thinking");
            text.textContent = t("discussion_thinking");
          } else if (turn.status === "PENDING" && !turn.text) {
            text.textContent = t("discussion_queued");
          }
          card.append(text);
          if (turn.error) {
            const fullError = `${turn.error}`;
            const firstLine = fullError.split(/\r?\n/, 1)[0]
              || t("discussion_turn_failed");
            const details = document.createElement("details");
            details.className = "turn-error-details";
            const summary = document.createElement("summary");
            const summaryText = document.createElement("span");
            summaryText.className = "turn-error-summary-text";
            summaryText.textContent = firstLine;
            summaryText.title = firstLine;
            summary.append(summaryText);
            const error = document.createElement("div");
            error.className = "turn-error";
            error.textContent = fullError;
            details.append(summary, error);
            card.append(details);
          }
          section.append(card);
        });
        historyEl.append(section);
      });
    }

    function isHistoryNearBottom() {
      const distance = historyEl.scrollHeight - historyEl.scrollTop - historyEl.clientHeight;
      return distance < 80;
    }

    function scrollHistoryToBottom() {
      window.requestAnimationFrame(() => {
        historyEl.scrollTop = historyEl.scrollHeight;
      });
    }

    function parseSummary(text) {
      const sections = new Map(SUMMARY_HEADINGS.map((heading) => [heading, []]));
      let active = null;
      `${text || ""}`.split(/\r?\n/).forEach((line) => {
        const normalized = line.trim().replace(/^#+\s*/, "").replace(/[：:]$/, "");
        if (sections.has(normalized)) {
          active = normalized;
        } else if (active) {
          sections.get(active).push(line);
        }
      });
      if (![...sections.values()].some((lines) => lines.length) && text) {
        sections.set("共識", [`${text}`]);
      }
      return sections;
    }

    function renderSummary() {
      summaryEl.replaceChildren();
      const turns = Array.isArray(state.turns) ? state.turns : [];
      const summaryTurn = [...turns].reverse().find((turn) => Number(turn.round_index) === 3);
      summaryText = summaryTurn ? `${summaryTurn.text || ""}` : "";
      copyEl.disabled = !summaryText;

      if (!summaryTurn || (!summaryText && summaryTurn.status !== "FAILED")) {
        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = t(
          isRunning() ? "discussion_summary_waiting" : "discussion_summary_empty",
        );
        summaryEl.append(placeholder);
        return;
      }
      if (summaryTurn.status === "FAILED") {
        const failure = document.createElement("div");
        failure.className = "error-banner";
        failure.textContent = `${summaryTurn.error || t("discussion_turn_failed")}`;
        summaryEl.append(failure);
        return;
      }

      const parsed = parseSummary(summaryText);
      const keys = {
        "共識": "discussion_consensus",
        "主要分歧": "discussion_disagreement",
        "建議方案": "discussion_recommendation",
        "風險與未知": "discussion_risks",
      };
      SUMMARY_HEADINGS.forEach((heading) => {
        const section = document.createElement("section");
        section.className = "summary-section";
        const title = document.createElement("h3");
        title.textContent = t(keys[heading]);
        const text = document.createElement("div");
        text.className = "summary-text";
        text.textContent = parsed.get(heading).join("\n").trim();
        section.append(title, text);
        summaryEl.append(section);
      });
    }

    function summaryForClipboard() {
      const parsed = parseSummary(summaryText);
      const keys = {
        "共識": "discussion_consensus",
        "主要分歧": "discussion_disagreement",
        "建議方案": "discussion_recommendation",
        "風險與未知": "discussion_risks",
      };
      return SUMMARY_HEADINGS.map((heading) => {
        const body = parsed.get(heading).join("\n").trim();
        return `${t(keys[heading])}\n${body}`;
      }).join("\n\n");
    }

    function render() {
      renderParticipants();
      renderModerator();
      renderEstimate();
      renderWorkingDirectory();
      renderControls();
      renderHistory();
      renderSummary();
    }

    function ensureTurn(event) {
      if (!Array.isArray(state.turns)) state.turns = [];
      let turn = state.turns.find((item) => item.id === event.turn_id);
      if (!turn) {
        turn = {
          id: event.turn_id,
          participant_id: event.participant_id,
          round_index: event.payload.round_index,
          text: "",
          status: "PENDING",
          error: null,
          supports_token_stream: Boolean(event.payload.supports_token_stream),
        };
        state.turns.push(turn);
      }
      if (typeof event.payload.supports_token_stream === "boolean") {
        turn.supports_token_stream = event.payload.supports_token_stream;
      }
      return turn;
    }

    function applyEvent(event) {
      if (!event || event.session_id !== currentSessionId) return false;
      const sequence = Number(event.event_seq);
      if (!Number.isFinite(sequence) || sequence <= latestEventSeq) return false;
      latestEventSeq = sequence;
      const payload = event.payload && typeof event.payload === "object" ? event.payload : {};
      event.payload = payload;

      if (event.kind === "turn_started") {
        ensureTurn(event).status = "RUNNING";
      } else if (event.kind === "text_delta") {
        const turn = ensureTurn(event);
        turn.text = `${turn.text || ""}${payload.text || ""}`;
      } else if (event.kind === "turn_done") {
        ensureTurn(event).status = "DONE";
      } else if (event.kind === "turn_failed") {
        const turn = ensureTurn(event);
        turn.status = "FAILED";
        turn.error = `${payload.error || ""}`;
      } else if (event.kind === "round_started") {
        state.status = Number(payload.round_index) === 1 ? "ROUND1_RUNNING" : "ROUND2_RUNNING";
      } else if (event.kind === "session_done") {
        state.status = `${payload.status || "COMPLETED"}`;
      } else if (event.kind === "session_failed") {
        state.status = "FAILED";
        window.discussionApplyError(`${payload.error || ""}`);
      }
      return event.kind === "turn_started" || event.kind === "text_delta";
    }

    window.discussionApplySnapshot = (snapshot) => {
      const next = snapshot && typeof snapshot === "object" ? snapshot : {};
      const sessionId = typeof next.session_id === "string" ? next.session_id : null;
      if (sessionId !== currentSessionId) {
        currentSessionId = sessionId;
        latestEventSeq = Number.isFinite(Number(next.event_seq)) ? Number(next.event_seq) : -1;
      } else {
        latestEventSeq = Math.max(latestEventSeq, Number(next.event_seq) || -1);
      }
      state = next;
      if (Object.prototype.hasOwnProperty.call(next, "working_directory")) {
        workingDirectory = typeof next.working_directory === "string"
          ? next.working_directory
          : null;
      }
      if (typeof next.topic === "string" && next.topic && topicEl.value !== next.topic) {
        topicEl.value = next.topic;
      }
      render();
    };

    window.discussionApplyEvents = (events) => {
      if (!Array.isArray(events)) return;
      const wasNearBottom = isHistoryNearBottom();
      const previousScrollTop = historyEl.scrollTop;
      let shouldFollow = false;
      events.forEach((event) => {
        shouldFollow = applyEvent(event) || shouldFollow;
      });
      render();
      if (wasNearBottom && shouldFollow) {
        scrollHistoryToBottom();
      } else {
        historyEl.scrollTop = previousScrollTop;
      }
    };

    window.discussionApplyDetection = (results) => {
      detection = Array.isArray(results) ? results : [];
      render();
    };

    window.discussionApplyWorkingDir = (path) => {
      workingDirectory = typeof path === "string" && path.length > 0 ? path : null;
      renderWorkingDirectory();
    };

    window.discussionApplyError = (message) => {
      errorEl.textContent = `${message || ""}`;
    };

    topicEl.addEventListener("input", renderControls);
    detectEl.addEventListener("click", () => {
      errorEl.textContent = "";
      send("discussion_detect");
    });
    pickFolderEl.addEventListener("click", () => send("discussion_pick_folder"));
    clearFolderEl.addEventListener("click", () => send("discussion_clear_folder"));
    startEl.addEventListener("click", () => {
      errorEl.textContent = "";
      send("discussion_start", {
        topic: topicEl.value,
        participants: [...selected],
        moderatorId: moderatorEl.value || null,
        workingDir: workingDirectory,
      });
    });
    stopEl.addEventListener("click", () => send("discussion_stop"));
    copyEl.addEventListener("click", async () => {
      if (!summaryText) return;
      const clipboardText = summaryForClipboard();
      let copied = false;
      try {
        await navigator.clipboard.writeText(clipboardText);
        copied = true;
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = clipboardText;
        document.body.append(textarea);
        try {
          textarea.select();
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        } finally {
          textarea.remove();
        }
      }
      if (!copied) {
        window.discussionApplyError(t("discussion_copy_failed"));
        return;
      }
      if (copyFeedbackTimer !== null) window.clearTimeout(copyFeedbackTimer);
      copyEl.textContent = t("discussion_copied");
      copyFeedbackTimer = window.setTimeout(() => {
        copyEl.textContent = t("discussion_copy");
        copyFeedbackTimer = null;
      }, 1200);
    });

    document.addEventListener("DOMContentLoaded", () => {
      const preferred = I18N[INITIAL_LANGUAGE] ? INITIAL_LANGUAGE : navigator.language;
      currentLanguage = I18N[preferred] ? preferred : "en";
      applyStaticText();
      render();
      send("discussion_attach");
    });
  </script>
</body>
</html>
